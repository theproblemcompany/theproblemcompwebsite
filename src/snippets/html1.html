
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/toolbox.css" rel="stylesheet">
    <meta name="description" content="" />
</head>
<script src="/src/js/loadhtml.js"></script>
<body>
    <div id='eventscont' class="container tcontainer">
        <div id="events-rr" class="row row-right event">
            <div class="event-inner">
                <div class="cover-container">
                    <img class="cover-photo zoomin" src="/src/images/scaleup.png" width=auto height = "150px">
                </div>
                <div class="title-container">
                    <p class="card-title zoomin">Scale Up</p>
                    <p class="card-description">Discover what creative automation can do for your business through this webinar</p>
                    <p class="card-time">01.06.2024 | 15:00 EET | 1h</p>
                </div>   
            </div>
            <div class="event-outter">
                <button class="eventclick zoomin" onclick="loadSnippet(4)"><h3>Open Event</h3></button>
                <div class="tag-container container">
                    <h4 class="row tag type">Online</h4>
                    <h4 class="row tag language">English</h4>
                </div>
            </div>
        </div>
        <div id="events-lr" class="row row-left event zoomin">
            <div class="event-inner">
                <div class="cover-container">
                    <img class="cover-photo zoomin" src="/src/images/star.png" height="150px" width="auto">
                </div>
                <div class="title-container">
                    <p class="card-title zoomin">Stele si Roboti</p>
                    <p class="card-description">Un workshop de automatizare creativa pentru antreprenori ambitiosi</p>
                    <p class="card-time">12.06.2024 | 19:00 EET | 2.5h</p>
                </div>   
            </div>
            <div class="event-outter">
                <button class="eventclick zoomin" onclick="loadSnippet(3)"><h3>Open Event</h3></button>
                <div class="tag-container container">
                    <h4 class="row tag type">In-Person</h4>
                    <h4 class="row tag language">Romanian</h4>
                </div>
            </div>
        </div>
        
        
    </div>

</body>
